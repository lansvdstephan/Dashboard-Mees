<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Babydashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f2;--card:#fff;--ink:#1f2d3a;--mute:#6b7c88;--line:#d9e3e1;--track:#dde8e6;--feed:#1f7a8c;--poop:#b9791f;--pee:#3f86d1;--danger:#c0473a;--fab:#1f7a8c;--fabink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a20;--card:#1b262e;--ink:#e8f0f2;--mute:#93a5b0;--line:#2b3a44;--track:#2b3a44;--feed:#4fb6c9;--poop:#e0a24a;--pee:#6aa8ee;--danger:#e8776a;--fab:#4fb6c9;--fabink:#0c1a20;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a20;--card:#1b262e;--ink:#e8f0f2;--mute:#93a5b0;--line:#2b3a44;--track:#2b3a44;--feed:#4fb6c9;--poop:#e0a24a;--pee:#6aa8ee;--danger:#e8776a;--fab:#4fb6c9;--fabink:#0c1a20;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:110px}
main{max-width:520px;margin:0 auto;padding:18px 14px}
h1{font-size:22px;font-weight:800;margin:4px 4px 2px}
.sub{margin:0 4px 16px;color:var(--mute);font-size:14px}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ringbox{background:var(--card);border-radius:22px;padding:12px 6px 10px;text-align:center}
.ring{position:relative;width:100%;max-width:104px;margin:0 auto;aspect-ratio:1}
.ring svg{width:100%;height:100%;display:block}
.ring .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.n b{font-size:26px;font-weight:800}
.n small{font-size:11px;color:var(--mute);margin-top:3px}
.lbl{font-size:13px;font-weight:600;margin-top:8px}
.step{display:flex;justify-content:center;gap:10px;margin-top:6px}
.step button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:17px;line-height:1;cursor:pointer}
h2{font-size:16px;margin:24px 4px 10px;font-weight:800}
.day{margin:14px 4px 6px;color:var(--mute);font-size:13px;font-weight:600}
.item{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.item .t{font-weight:800;font-size:15px}
.item .d{color:var(--mute);font-size:13px;margin-top:2px;line-height:1.45}
.item button{border:0;background:transparent;color:var(--mute);font-size:18px;cursor:pointer;padding:2px 6px}
.empty{color:var(--mute);padding:18px 6px;text-align:center;font-size:14px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:var(--fab);color:var(--fabink);font-size:34px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));z-index:21;transform:translateY(105%);transition:transform .25s ease;max-width:520px;margin:0 auto}
.sheet.open{transform:none}
